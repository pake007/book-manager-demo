<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人图书管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 我的个人图书管理系统</h1>
            <p>数据保存在本地浏览器中，完全私密</p>
        </header>

        <div class="book-form">
            <h2>添加新图书</h2>
            <form id="addBookForm">
                <div class="form-group">
                    <input type="text" id="bookTitle" placeholder="书名（必填）" required>
                </div>
                <div class="form-group">
                    <input type="text" id="bookAuthor" placeholder="作者">
                </div>
                <div class="form-group">
                    <input type="number" id="bookYear" placeholder="出版年份" min="1000" max="2030">
                </div>
                <div class="form-group">
                    <select id="bookStatus">
                        <option value="未读">未读</option>
                        <option value="阅读中">阅读中</option>
                        <option value="已读完">已读完</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="number" id="bookRating" placeholder="评分（1-5）" min="1" max="5" step="0.1">
                </div>
                <button type="submit">添加图书</button>
            </form>
        </div>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="搜索书名或作者...">
            <select id="statusFilter">
                <option value="">所有状态</option>
                <option value="未读">未读</option>
                <option value="阅读中">阅读中</option>
                <option value="已读完">已读完</option>
            </select>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" id="totalBooks">0</span>
                <span class="stat-label">总藏书</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="readBooks">0</span>
                <span class="stat-label">已读</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="readingBooks">0</span>
                <span class="stat-label">阅读中</span>
            </div>
        </div>

        <div class="books-list">
            <h2>我的藏书 (<span id="booksCount">0</span>)</h2>
            <div id="booksContainer" class="books-container">
                <!-- 图书列表将在这里动态生成 -->
            </div>
        </div>

        <div class="actions">
            <button onclick="exportData()" class="btn-secondary">导出数据</button>
            <button onclick="importData()" class="btn-secondary">导入数据</button>
            <button onclick="clearAllData()" class="btn-danger">清空所有数据</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
